name: Build release Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux amd64 image
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -f deploy/Dockerfile -t "pictelier:$version" .

      - name: Export image and deployment template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          archive="pictelier-$RELEASE_VERSION-amd64.tar.gz"
          docker save "pictelier:$RELEASE_VERSION" | gzip -1 > "artifacts/$archive"
          cp deploy/docker-compose.yml artifacts/docker-compose.yml
          (cd artifacts && sha256sum "$archive" docker-compose.yml > SHA256SUMS)

      - name: Save release files
        uses: actions/upload-artifact@v4
        with:
          name: docker-release-${{ github.sha }}
          compression-level: 0
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/docker-compose.yml
          if-no-files-found: error
