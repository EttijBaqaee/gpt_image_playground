name: Remove superseded fork images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify versions and delete only superseded images
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          endpoint = 'https://api.github.com/users/EttijBaqaee/packages/container/gpt_image_playground/versions'
          expected = {
              '0.3.66.1': 'sha256:86d1db4dac11d71eb9a829787f04eca97bfef0c6e3f929cddbbd25a842d62260',
              '0.3.66.2': 'sha256:a24929f5d6eb06a5b66f97e9a7da73a6ebd3d3efdac5332e7eeb71fc1f79bc13',
          }
          current_digest = 'sha256:6be5c26a5c5d73338d734a59dd07ff7cc0ade0f39a96119da29164fed621e713'
          def request(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response) if method == 'GET' else response.status
          versions = request(endpoint + '?per_page=100')
          def tags(version):
              return set(version['metadata']['container']['tags'])
          protected = [v for v in versions if tags(v) & {'0.3.66.3', 'latest'}]
          assert len(protected) == 1 and tags(protected[0]) >= {'0.3.66.3', 'latest'}
          assert protected[0]['name'] == current_digest
          selected = []
          for tag, digest in expected.items():
              matches = [v for v in versions if tag in tags(v)]
              assert len(matches) == 1, tag
              version = matches[0]
              assert version['name'] == digest and tags(version) <= set(expected), tag
              selected.append(version)
          removed = []
          for version in selected:
              assert request(endpoint + '/' + str(version['id']), 'DELETE') == 204
              removed.append({'id': version['id'], 'digest': version['name'], 'tags': sorted(tags(version))})
          remaining = request(endpoint + '?per_page=100')
          assert not any(tags(v) & set(expected) for v in remaining)
          preserved = next(v for v in remaining if v['id'] == protected[0]['id'])
          assert tags(preserved) >= {'0.3.66.3', 'latest'} and preserved['name'] == current_digest
          report = {'deleted': removed, 'preserved': {'id': preserved['id'], 'digest': preserved['name'], 'tags': sorted(tags(preserved))}}
          print(json.dumps(report, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Removed only 0.3.66.1 and 0.3.66.2. Preserved 0.3.66.3 and latest with their original digest.\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PY
