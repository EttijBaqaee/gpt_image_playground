name: Publish verified Docker image to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag containing the verified Docker archive
        required: true
        default: v0.3.66.1
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'v0.3.66.1' }}
    steps:
      - name: Download and verify the tested image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          version="${RELEASE_TAG#v}"
          archive="gpt-image-playground-fork-${version}-amd64.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern SHA256SUMS --dir release
          (cd release && sha256sum --check SHA256SUMS --ignore-missing)
          docker load --input "release/$archive"
          source="gpt-image-playground-fork:$version"
          [[ "$(docker image inspect "$source" --format '{{.Os}}/{{.Architecture}}')" == linux/amd64 ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$source" "$image:$version"
          docker tag "$source" "$image:latest"
          printf 'IMAGE=%s\nVERSION=%s\n' "$image" "$version" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          printf 'Published `%s:%s` and `%s:latest` (linux/amd64).\n\n' \
            "$IMAGE" "$VERSION" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf 'The Release archive passed SHA256 verification. The tested application was not rebuilt.\n' >> "$GITHUB_STEP_SUMMARY"
