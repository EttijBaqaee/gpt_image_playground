name: Publish Docker image to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag containing the Docker archive
        required: true
        default: v0.3.66.8
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'v0.3.66.8' }}
    steps:
      - name: Load the release image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          version="${RELEASE_TAG#v}"
          archive="pictelier-${version}-amd64.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern SHA256SUMS --dir release
          (cd release && sha256sum --check SHA256SUMS --ignore-missing)
          docker load --input "release/$archive"
          source="pictelier:$version"
          [[ "$(docker image inspect "$source" --format '{{.Os}}/{{.Architecture}}')" == linux/amd64 ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$source" "$image:$version"
          printf 'IMAGE=%s\nVERSION=%s\n' "$image" "$version" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          printf 'Published `%s:%s` (linux/amd64).\n\n' \
            "$IMAGE" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
